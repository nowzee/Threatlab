<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Erreur serveur | CyberHoney</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variable.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--background-color-dark);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .error-container {
            max-width: 500px;
            padding: 40px 20px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: var(--danger-color);
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255, 58, 94, 0.3);
        }

        .error-title {
            font-size: 28px;
            font-weight: 600;
            margin: 20px 0;
            color: var(--white);
        }

        .error-message {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: var(--text-color-muted);
        }

        .home-button {
            background-color: var(--button-background);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .home-button:hover {
            background-color: var(--button-hover-background-login);
            transform: translateY(-2px);
        }

        .error-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--danger-color);">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>

        <h1 class="error-code">500</h1>
        <h2 class="error-title">Erreur interne du serveur</h2>
        <p class="error-message">Oups ! Quelque chose s'est mal passé de notre côté. Notre équipe a été notifiée et travaille à résoudre le problème. Veuillez réessayer dans quelques instants.</p>

        <a href="/dashboard" class="home-button">Retour au tableau de bord</a>
    </div>
</body>
</html>
