<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page non trouvée | CyberHoney</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variable.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--background-color-dark);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .error-container {
            max-width: 500px;
            padding: 40px 20px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: var(--accent-color);
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.3);
        }

        .error-title {
            font-size: 28px;
            font-weight: 600;
            margin: 20px 0;
            color: var(--white);
        }

        .error-message {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: var(--text-color-muted);
        }

        .home-button {
            background-color: var(--button-background);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .home-button:hover {
            background-color: var(--button-hover-background-login);
            transform: translateY(-2px);
        }

        .honeypot-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <svg class="honeypot-icon" xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color);">
            <path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34"></path>
            <path d="M3 15h3m9-3h3"></path>
            <path d="M21 14a3 3 0 1 1-3 3v-1"></path>
            <path d="M14 7V5a3 3 0 0 1 3-3l4 9-8 11z"></path>
        </svg>

        <h1 class="error-code">404</h1>
        <h2 class="error-title">Page non trouvée</h2>
        <p class="error-message">Oups ! Il semble que la page que vous recherchez n'existe pas ou a été déplacée. Comme un bon honeypot, elle a peut-être disparu pour tromper les intrus.</p>

        <a href="/dashboard" class="home-button">Retour au tableau de bord</a>
    </div>
</body>
</html>
