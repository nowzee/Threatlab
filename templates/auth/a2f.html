<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Factor Authentication</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variable.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
    <style>

        /* Supprimer la bordure bleue par défaut du navigateur */
        .code-box:focus {
            -webkit-box-shadow: none !important;
        }
    </style>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1>A2F Authentication</h1>
        </div>
        <form class="login-form" action="/auth/a2f" method="post">
            <div class="form-group code-inputs">
                {% for i in range(6) %}
                <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]*"
                       id="code-{{ i }}" autocomplete="off">
                {% endfor %}
                <input type="hidden" name="code" id="full-code">
            </div>
            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}
        </form>
    </div>
</body>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const inputs = [];

    // Initialiser tous les champs
    for (let i = 0; i < 6; i++) {
        inputs[i] = document.getElementById('code-' + i);

        // Événement input pour la saisie normale
        inputs[i].addEventListener('input', function(e) {
            if (this.value.length === 1) {
                // Se déplacer au champ suivant
                if (i < 5) {
                    inputs[i + 1].focus();
                }
            }
            checkAndSubmit();
        });

        // Événement keydown pour la navigation
        inputs[i].addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !this.value && i > 0) {
                inputs[i - 1].focus();
                inputs[i - 1].value = '';
            }
        });

        // Événement paste pour tous les champs
        inputs[i].addEventListener('paste', function(e) {
            e.preventDefault();

            const pastedData = e.clipboardData.getData('text');
            const digits = pastedData.replace(/[^0-9]/g, '');

            // Remplir les champs à partir du champ actuel
            for (let j = 0; j < digits.length && (i + j) < 6; j++) {
                inputs[i + j].value = digits[j];
            }

            // Déplacer le focus au dernier champ rempli ou au suivant
            const lastFilledIndex = Math.min(i + digits.length - 1, 5);
            const nextIndex = Math.min(i + digits.length, 5);

            if (lastFilledIndex < 5) {
                inputs[nextIndex].focus();
            } else {
                inputs[lastFilledIndex].focus();
            }

            checkAndSubmit();
        });
    }

    function checkAndSubmit() {
        let code = '';
        let allFilled = true;

        for (let i = 0; i < 6; i++) {
            const val = inputs[i].value;
            if (!val || !val.match(/^[0-9]$/)) {
                allFilled = false;
                break;
            }
            code += val;
        }

        if (allFilled) {
            document.getElementById('full-code').value = code;
            setTimeout(() => {
                document.querySelector('.login-form').submit();
            }, 200);
        }
    }
});
</script>
</html>
